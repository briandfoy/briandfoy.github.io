<script>
document.querySelectorAll('figure.highlight').forEach(function (figure) {
	var tools = document.createElement('div');
	tools.className = 'code-tools';

	var langCode = figure.querySelector('code[data-lang]');
	if (langCode) {
		var label = document.createElement('span');
		label.className = 'code-lang';
		label.textContent = langCode.getAttribute('data-lang');
		tools.appendChild(label);
	}

	var button = document.createElement('button');
	button.className = 'copy-code';
	button.type = 'button';
	button.textContent = 'Copy';
	button.addEventListener('click', function () {
		var code = figure.querySelector('td.code pre') || figure.querySelector('pre code');
		if (!code) return;
		navigator.clipboard.writeText(code.innerText).then(function () {
			button.textContent = 'Copied!';
		}, function () {
			button.textContent = 'Failed';
		});
		setTimeout(function () { button.textContent = 'Copy'; }, 2000);
	});
	tools.appendChild(button);
	figure.appendChild(tools);
});
</script>
