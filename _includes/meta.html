    <meta charset="utf-8" />
    <meta content='text/html; charset=utf-8' http-equiv='Content-Type'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    {% if page.excerpt %}
    <meta name="description" content="{{ page.excerpt| strip_html | escape }}" />
    <meta property="og:description" content="{{ page.excerpt| strip_html | escape }}" />
    <meta name="twitter:description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 200 | escape }}" />
    {% else %}
    <meta name="description" content="{{ site.description | strip_html | escape }}">
    <meta property="og:description" content="{{ site.description | strip_html | escape }}" />
    <meta name="twitter:description" content="{{ site.description | strip_html | escape }}" />
    {% endif %}
    <meta name="author" content="{{ site.name | escape }}" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@{{ site.footer-links.twitter }}" />
    <meta name="twitter:creator" content="@{{ site.footer-links.twitter }}" />
    <meta name="twitter:image" content="{{ page.image | default: site.twitter_card_image | absolute_url }}" />

    {% if page.title %}
    <meta property="og:title" content="{{ page.title | escape }}" />
    <meta name="twitter:title" content="{{ page.title | escape }}" />
    {% else %}
    <meta name="twitter:title" content="{{ site.title | escape }}" />
    {% endif %}
